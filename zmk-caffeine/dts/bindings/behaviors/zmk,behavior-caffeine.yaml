description: |
  Caffeine behavior. Press to toggle. While on, taps the listed bindings on a
  timer to keep the host awake.

compatible: "zmk,behavior-caffeine"

include: zero_param.yaml

properties:
  bindings:
    type: phandle-array
    required: true
    description: Behaviors to tap.
  interval-ms:
    type: int
    default: 30000
    description: Time between ticks in milliseconds.
  tap-ms:
    type: int
    default: 30
    description: Time between press and release of each tap in milliseconds.
  wait-ms:
    type: int
    default: 0
    description: Pause between taps inside one tick in sequence mode, in milliseconds.
  mode:
    type: string
    default: "rotate"
    enum:
      - "rotate"
      - "sequence"
    description: |
      rotate: tap one binding per tick, in turn.
      sequence: tap every binding per tick, back to back, so a closed shape
      such as up/left/down/right returns the pointer to where it started.
  cancel-on-keypress:
    type: boolean
    description: Turn caffeine off when any keycode is pressed.
